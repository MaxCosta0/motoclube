spring.application.name=motoclube

spring.datasource.url=jdbc:postgresql://localhost:5432/motoclube
spring.datasource.username=motoclube
spring.datasource.password=motoclube

# O schema pertence ao Flyway. O Hibernate apenas confere se o mapeamento bate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.flyway.encoding=UTF-8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
